name: Actualizar Registro CEN

on:
  schedule:
    # GitHub interpreta el cron en UTC. */5 = cada 5 minutos.
    # Nota: en la práctica GitHub Actions no garantiza el minuto exacto;
    # en repos con poca actividad puede haber demoras de varios minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar y transformar datos del Coordinador
        run: python scripts/fetch_data.py

      - name: Hacer commit si hubo cambios
        run: |
          git config user.name "pinares-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se hace commit."
          else
            git commit -m "Actualización automática $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
