name: Actualizar RIO Coordinador

on:
  # GitHub Actions usa UTC. Ejecutamos a las 03:01 y 04:01 UTC y
  # el script continúa sólo cuando en Chile sean las 00:01.
  # Esto cubre los cambios de horario de Chile sin ejecutar dos veces
  # la actualización real.
  schedule:
    - cron: '1 3 * * *'
    - cron: '1 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-rio
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar descarga diaria
        id: fetch
        run: python scripts/fetch_data.py

      - name: Subir evidencia de diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-rio
          path: |
            rio_error.png
            tmp_downloads/
          if-no-files-found: ignore
          retention-days: 3

      - name: Verificar cambios
        id: changes
        run: |
          if git diff --quiet -- data/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push del JSON
        if: success() && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Actualizar RIO del Coordinador"
          git push
