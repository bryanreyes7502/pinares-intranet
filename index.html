<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pinares · Registro de Instrucciones de Operación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0f1c;
    --panel: #101a2c;
    --panel-raised: #142136;
    --border: #223049;
    --text: #e7ecf5;
    --text-muted: #7f8fac;
    --amber: #e8a33d;
    --cyan: #4fd8c0;
    --red: #e8615a;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 42px 42px;
    background-attachment: fixed;
    background-position: -1px -1px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  header{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .brand{
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand .name{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--amber);
  }
  .brand h1{
    margin: 0;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.3;
    max-width: 46ch;
  }
  .status-block{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .status-row{ display: flex; align-items: center; gap: 8px; }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .dot.ok{ background: var(--cyan); box-shadow: 0 0 0 0 rgba(79,216,192,0.6); animation: pulse 2s infinite; }
  .dot.error{ background: var(--red); }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(79,216,192,0.5); }
    70%{ box-shadow: 0 0 0 7px rgba(79,216,192,0); }
    100%{ box-shadow: 0 0 0 0 rgba(79,216,192,0); }
  }
  .toolbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .toolbar input{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 9px 12px;
    min-width: 260px;
    outline: none;
  }
  .toolbar input:focus{ border-color: var(--amber); }
  .count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .table-panel{
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: auto;
    max-height: 68vh;
  }
  table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th{
    position: sticky;
    top: 0;
    background: var(--panel-raised);
    text-align: left;
    padding: 10px 14px;
    font-weight: 600;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td{
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
    white-space: nowrap;
  }
  tbody tr:hover{ background: rgba(232,163,61,0.06); }
  .empty, .error-box{
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  .error-box{ color: var(--red); }
  footer{
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  a{ color: var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="name">PINARES</span>
      <h1>Registro de Instrucciones de Operación — Coordinador Eléctrico Nacional</h1>
    </div>
    <div class="status-block">
      <div class="status-row"><span class="dot" id="statusDot"></span><span id="statusText">Cargando…</span></div>
      <div id="lastUpdate">Última actualización: —</div>
      <div id="nextRefresh">Próxima consulta en 5:00</div>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="filterInput" placeholder="Filtrar registros…" />
    <span class="count" id="rowCount"></span>
  </div>

  <div class="table-panel" id="tablePanel">
    <div class="empty">Cargando datos…</div>
  </div>

  <footer>
    <span>Fuente: coordinador.cl — datos públicos del Coordinador Eléctrico Nacional.</span>
    <span>Actualiza automáticamente cada 5 minutos.</span>
  </footer>
</div>

<script>
  const REFRESH_MS = 5 * 60 * 1000;
  let currentData = null;
  let countdownSeconds = REFRESH_MS / 1000;

  async function loadData(){
    try{
      const res = await fetch('data/data.json?_=' + Date.now());
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      currentData = json;
      renderStatus(json);
      renderTable(json, document.getElementById('filterInput').value);
    }catch(err){
      document.getElementById('statusDot').className = 'dot error';
      document.getElementById('statusText').textContent = 'Error al cargar datos';
      document.getElementById('tablePanel').innerHTML =
        '<div class="error-box">No se pudo cargar data/data.json — ' + err.message + '</div>';
    }
    countdownSeconds = REFRESH_MS / 1000;
  }

  function renderStatus(json){
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    const last = document.getElementById('lastUpdate');
    if(json.status === 'ok'){
      dot.className = 'dot ok';
      text.textContent = 'En vivo';
    } else if(json.status === 'error'){
      dot.className = 'dot error';
      text.textContent = 'Último intento falló';
    } else {
      dot.className = 'dot';
      text.textContent = 'Sin datos aún';
    }
    last.textContent = 'Última actualización: ' + (json.actualizado_en
      ? new Date(json.actualizado_en).toLocaleString('es-CL')
      : '—');
  }

  function renderTable(json, filterText){
    const panel = document.getElementById('tablePanel');
    const rows = json.registros || [];
    if(rows.length === 0){
      panel.innerHTML = '<div class="empty">' +
        (json.error ? 'Sin registros disponibles. Detalle: ' + json.error : 'Sin registros para la fecha consultada.') +
        '</div>';
      document.getElementById('rowCount').textContent = '';
      return;
    }
    const columns = Object.keys(rows[0]);
    const needle = (filterText || '').toLowerCase().trim();
    const filtered = needle
      ? rows.filter(r => columns.some(c => String(r[c] ?? '').toLowerCase().includes(needle)))
      : rows;

    let html = '<table><thead><tr>';
    columns.forEach(c => html += '<th>' + escapeHtml(c) + '</th>');
    html += '</tr></thead><tbody>';
    filtered.forEach(r => {
      html += '<tr>';
      columns.forEach(c => html += '<td>' + escapeHtml(r[c] ?? '') + '</td>');
      html += '</tr>';
    });
    html += '</tbody></table>';
    panel.innerHTML = html;
    document.getElementById('rowCount').textContent =
      filtered.length + ' de ' + rows.length + ' registros';
  }

  function escapeHtml(value){
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');
  }

  document.getElementById('filterInput').addEventListener('input', (e) => {
    if(currentData) renderTable(currentData, e.target.value);
  });

  setInterval(() => {
    countdownSeconds -= 1;
    if(countdownSeconds <= 0){
      loadData();
    } else {
      const m = Math.floor(countdownSeconds / 60);
      const s = String(countdownSeconds % 60).padStart(2, '0');
      document.getElementById('nextRefresh').textContent = 'Próxima consulta en ' + m + ':' + s;
    }
  }, 1000);

  loadData();
</script>
</body>
</html>
